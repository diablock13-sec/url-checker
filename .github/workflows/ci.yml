name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pasang Python
        run: uv python install ${{ matrix.python-version }}
      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} --isolated ruff check .
      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} --isolated pytest -q
